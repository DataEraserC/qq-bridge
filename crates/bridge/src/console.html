<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>acb-bridge 控制台</title>
<style>
  :root { --bg:#14161a; --panel:#1e2127; --line:#33373f; --text:#d8dce3; --dim:#8b919c; --accent:#4f9cf9; --ok:#59c37f; --warn:#e0a33e; --err:#e06c6c; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:14px/1.6 system-ui,"PingFang SC","Microsoft YaHei",sans-serif; }
  header { display:flex; align-items:center; gap:12px; padding:10px 18px; border-bottom:1px solid var(--line); background:var(--panel); }
  header h1 { font-size:16px; margin:0; font-weight:600; }
  header .spacer { flex:1; }
  header button { background:none; border:1px solid var(--line); color:var(--dim); border-radius:6px; padding:3px 10px; cursor:pointer; }
  nav { display:flex; gap:4px; padding:8px 18px 0; }
  nav button { background:none; border:1px solid transparent; border-bottom:none; color:var(--dim); padding:6px 14px; border-radius:8px 8px 0 0; cursor:pointer; font-size:14px; }
  nav button.active { background:var(--panel); color:var(--text); border-color:var(--line); }
  main { padding:16px 18px 40px; max-width:1100px; }
  section { display:none; }
  section.active { display:block; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:14px 16px; margin-bottom:14px; }
  .card h2 { font-size:14px; margin:0 0 10px; color:var(--accent); font-weight:600; }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  th, td { text-align:left; padding:5px 8px; border-bottom:1px solid var(--line); vertical-align:top; }
  th { color:var(--dim); font-weight:500; white-space:nowrap; }
  td.wrap { word-break:break-all; }
  .pill { display:inline-block; padding:0 8px; border-radius:10px; font-size:12px; margin-right:4px; }
  .pill.open { background:#3a2b2b; color:var(--err); }
  .pill.acked { background:#3a342b; color:var(--warn); }
  .pill.resolved { background:#2b3a2e; color:var(--ok); }
  .pill.wontfix { background:#2b2d3a; color:var(--dim); }
  button.act { background:var(--accent); border:none; color:#fff; border-radius:6px; padding:4px 12px; cursor:pointer; font-size:13px; }
  button.act.danger { background:var(--err); }
  button.act.ghost { background:none; border:1px solid var(--line); color:var(--dim); }
  .stat { display:flex; gap:18px; flex-wrap:wrap; }
  .stat div { min-width:120px; }
  .stat b { display:block; font-size:22px; font-weight:600; }
  .stat span { color:var(--dim); font-size:12px; }
  .kv { display:grid; grid-template-columns:180px 1fr; gap:2px 12px; font-size:13px; }
  .kv .k { color:var(--dim); }
  .secret { color:var(--warn); letter-spacing:2px; }
  .muted { color:var(--dim); }
  pre { background:var(--bg); border:1px solid var(--line); border-radius:8px; padding:10px; overflow:auto; font-size:12px; }
  .err { color:var(--err); }
  .empty { color:var(--dim); font-style:italic; }
  textarea { width:100%; min-height:420px; background:var(--bg); color:var(--text); border:1px solid var(--line); border-radius:8px; font:12px/1.5 ui-monospace,SFMono-Regular,Consolas,monospace; padding:10px; resize:vertical; }
  .banner { border:1px solid var(--warn); background:#33290f; color:var(--warn); border-radius:8px; padding:8px 12px; margin-bottom:12px; }
  .banner button { float:right; }
  .mini { padding:1px 8px; font-size:12px; border:1px solid var(--line); background:none; color:var(--accent); border-radius:5px; cursor:pointer; margin-left:6px; vertical-align:middle; }
  .mini.danger { color:var(--err); }
  #edit-area input, #edit-area select { background:var(--bg); color:var(--text); border:1px solid var(--line); border-radius:6px; padding:4px 8px; font-size:13px; }
  #edit-area input[type=text] { width:100%; }
  .form-row { display:flex; gap:10px; align-items:center; margin:7px 0; flex-wrap:wrap; }
  .form-row > label:first-child { min-width:110px; color:var(--dim); font-size:13px; }
  .form-row input[type=checkbox] { width:auto; }
  .hint { color:var(--dim); font-size:12px; }
  /* 表单弹窗：从对应条目点开，浮层居中，不再插到页面顶部 */
  #modal { position:fixed; inset:0; background:rgba(0,0,0,.55); display:none; align-items:flex-start; justify-content:center; z-index:50; overflow:auto; padding:40px 16px; }
  #modal.open { display:flex; }
  #modal-box { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:18px 20px; width:min(640px, 100%); box-shadow:0 12px 40px rgba(0,0,0,.5); }
  #modal-box h2 { margin-top:0; }
</style>
</head>
<body>
<header>
  <h1>acb-bridge 控制台</h1>
  <span class="muted" id="conn-note"></span>
  <div class="spacer"></div>
  <button id="logout">退出</button>
</header>
<nav>
  <button data-tab="status" class="active">概览</button>
  <button data-tab="sessions">会话</button>
  <button data-tab="feedback">反馈</button>
  <button data-tab="config">配置</button>
</nav>
<main>
  <section id="tab-status" class="active"><div class="card"><h2>概览</h2><div class="stat" id="status"></div><p class="muted" id="status-note"></p></div></section>
  <section id="tab-sessions"><div id="sessions"></div></section>
  <section id="tab-feedback"><div class="card"><h2>agent 反馈</h2><div id="feedback"></div></div></section>
  <section id="tab-config"><div id="config"></div></section>
</main>
<div id="modal" onclick="if(event.target===this)closeModal()"><div id="modal-box"></div></div>
<script>
"use strict";
const $ = (s, el=document) => el.querySelector(s);
// token 存 localStorage；包 try/catch——某些嵌入环境（沙箱 iframe）禁存储会直接抛异常。
// 就算 localStorage 用不了，服务端种的 HttpOnly cookie 也能保住登录。
const store = {
  get(k) { try { return localStorage.getItem(k); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch {} },
  del(k) { try { localStorage.removeItem(k); } catch {} },
};
const token = (() => {
  const m = location.search.match(/[?&]token=([^&]*)/);
  if (m) { store.set("acb-console-token", decodeURIComponent(m[1])); history.replaceState(null, "", location.pathname); }
  return store.get("acb-console-token") || "";
})();
if (!token) { location.href = "/?login=1"; }

async function api(path, options = {}) {
  const res = await fetch(path, { ...options, headers: { "Authorization": "Bearer " + token, "Content-Type": "application/json", ...(options.headers||{}) } });
  if (res.status === 401) { store.del("acb-console-token"); location.href = "/?login=1"; throw new Error("未授权"); }
  const body = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(body.error || ("HTTP " + res.status));
  return body;
}
const esc = (v) => String(v ?? "").replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const secret = (v) => '<span class="secret">******</span>';

async function loadStatus() {
  const s = await api("/api/status");
  $("#status").innerHTML = [
    ["连接", s.connections], ["会话", s.sessions], ["harness", s.harnesses],
    ["忙着的会话", s.busy_sessions], ["排队轮次", s.queued_turns],
    ["配置版本", s.config_version],
  ].map(([k, v]) => `<div><b>${esc(v)}</b><span>${esc(k)}</span></div>`).join("");
  $("#status-note").innerHTML = s.staged_config
    ? '<span class="err">有一份暂存的新配置，下一次收消息/开轮时自动生效</span>（去「配置」页可放弃暂存）'
    : "配置按轮次边界热重载（ADR-0009）：在「配置」页编辑保存后，下一次收消息/开轮自动生效。";
}

async function loadSessions() {
  const { sessions } = await api("/api/sessions");
  $("#sessions").innerHTML = sessions.length ? sessions.map((s) => {
    const map = s.map;
    return `<div class="card"><h2>${esc(s.name || s.id)} <span class="muted">(${esc(s.id)})</span></h2>
    <div class="kv">
      <div class="k">harness</div><div>${esc(s.harness)}</div>
      <div class="k">人格</div><div>${esc(s.persona || "—")}</div>
      <div class="k">模型</div><div>${esc(s.model || "由 harness 侧决定")}</div>
      <div class="k">记忆</div><div>${esc((s.memories||[]).join(", ") || "无")}</div>
      <div class="k">订阅</div><div>${(s.subscriptions||[]).map(esc).join("<br>") || "无"}</div>
      <div class="k">harness 侧映射</div><div>${map ? esc(map.harness_session) + '<br><span class="muted">更新于 ' + esc(new Date(map.updated_at).toLocaleString()) + '</span>' : '<span class="muted">还没有（harness 连上后声明）</span>'}</div>
    </div>
    <p><button class="act danger" onclick="resetSession('${esc(s.id)}')">断开映射并重置会话</button></p>
    <div id="reset-note-${esc(s.id)}" class="muted"></div></div>`;
  }).join("") : '<div class="card"><p class="empty">没有会话</p></div>';
}

async function resetSession(id) {
  if (!confirm("确定重置会话 " + id + " ？harness 侧会收到 reset，桥侧映射断开。")) return;
  const note = $("#reset-note-" + id);
  try {
    const r = await api("/api/session/" + encodeURIComponent(id) + "/reset", { method: "POST", body: "{}" });
    note.textContent = "✓ " + (r.note || "reset 指令已发出");
    setTimeout(loadSessions, 1500);
  } catch (e) { note.innerHTML = '<span class="err">' + esc(e.message) + "</span>"; }
}

async function loadFeedback() {
  const { feedback } = await api("/api/feedback?limit=50");
  $("#feedback").innerHTML = feedback.length ? `<table>
    <tr><th>#</th><th>状态</th><th>类型</th><th>标题</th><th>来源</th><th>次数</th><th>最近</th><th></th></tr>
    ${feedback.map((f) => `<tr>
      <td>${f.id}</td>
      <td><span class="pill ${esc(f.status)}">${esc(f.status)}</span></td>
      <td>${esc(f.kind || "—")}${f.severity && f.severity !== "info" ? '<br><span class="muted">' + esc(f.severity) + "</span>" : ""}</td>
      <td class="wrap">${esc(f.title)}${f.body ? '<br><span class="muted">' + esc(String(f.body).slice(0, 160)) + "</span>" : ""}${f.suggestion ? '<br><span class="muted">建议：' + esc(String(f.suggestion).slice(0, 120)) + "</span>" : ""}</td>
      <td class="wrap">${esc(f.tool || "—")}${f.session ? '<br><span class="muted">' + esc(f.session) + "</span>" : ""}</td>
      <td>${f.occurrences || 1}${f.repeats ? "（重复）" : ""}</td>
      <td class="muted">${esc(new Date(f.last_at).toLocaleString())}</td>
      <td><button class="act ghost" onclick="resolveFeedback(${f.id})">标记</button></td>
    </tr>`).join("")}</table>` : '<p class="empty">没有反馈记录</p>';
}

async function resolveFeedback(id) {
  const status = prompt("改成什么状态？open / acked / resolved / wontfix", "resolved");
  if (!status) return;
  const note = prompt("备注（可空）", "") ?? "";
  try { await api("/api/feedback/" + id + "/status", { method: "POST", body: JSON.stringify({ status, note }) }); loadFeedback(); }
  catch (e) { alert(e.message); }
}

function wakeText(w) {
  if (!w) return "—";
  const parts = [];
  if (w.at_mention) parts.push("@我");
  if (w.reply) parts.push("引用我");
  if (w.name_mention && (w.names||[]).length) parts.push("叫名字(" + w.names.join("/") + ")");
  if (w.poke) parts.push("拍我");
  if (w.accumulate) parts.push("攒" + w.accumulate + "条");
  if ((w.events||[]).length) parts.push("事件:" + w.events.join("/"));
  if ((w.keywords||[]).length) parts.push("关键词:" + w.keywords.join("/"));
  if ((w.ignore_speakers||[]).length) parts.push("无视:" + w.ignore_speakers.join("/"));
  return parts.join("，") || "（全关）";
}

let tomlEditorText = null;   // 非 null = 正在编辑 TOML（textarea 的当前内容）
let tomlResult = null;       // 刚保存完的结果（changes / hot_reload / needs_restart 清单）
let cfgCache = null;         // 最近一次加载的 /api/config（表单的数据源）

async function loadConfig() {
  const s = await api("/api/status");
  const banner = s.staged_config
    ? `<div class="banner">有暂存的新配置，下一次收消息/开轮时自动生效。<button class="act ghost" onclick="discardStaged()">放弃暂存</button><div style="clear:both"></div></div>`
    : "";
  if (tomlEditorText !== null) {
    $("#config").innerHTML = banner + `
    <div class="card"><h2>编辑配置 TOML（高级）</h2>
      <p class="muted">结构化表单能满足日常改动；这里留了原文编辑做兜底。
      保存时先校验再落盘：解析不过一个字节都不写；落盘前自动备份成 config.toml.bak。</p>
      <textarea id="toml-text" spellcheck="false"></textarea>
      <p>
        <button class="act" onclick="saveToml()">校验并保存</button>
        <button class="act ghost" onclick="cancelToml()">取消</button>
      </p>
      <div id="toml-result"></div>
    </div>`;
    $("#toml-text").value = tomlEditorText;
    renderTomlResult();
    return;
  }
  const c = await api("/api/config");
  cfgCache = c;
  const connRows = (c.connections||[]).map((k) => `<tr>
    <td>${esc(k.id)}</td><td>${esc(k.platform)}/${esc(k.kind)}</td><td class="wrap">${esc(k.url)}</td>
    <td>${k.token === null ? '<span class="muted">无</span>' : secret(k.token)}</td>
    <td>${esc(k.account)}</td><td>${esc(k.allow_destructive)}</td>
    <td><button class="mini" onclick="editConnection('${esc(k.id)}')">编辑</button></td></tr>`).join("");
  const sessRows = (c.sessions||[]).map((s) => `<tr>
    <td>${esc(s.id)}${s.name && s.name !== s.id ? '<br><span class="muted">' + esc(s.name) + "</span>" : ""}</td>
    <td>${esc(s.harness)}</td><td>${esc(s.persona || "—")}</td>
    <td>${s.token === null ? "" : secret(s.token)}</td>
    <td class="wrap">${(s.subscriptions||[]).map((sub, i) => esc(sub.room) + '<br><span class="muted">唤醒：' + esc(wakeText(sub.wake)) + "</span>"
      + `<button class="mini" onclick="editWake('${esc(s.id)}',${i})">唤醒</button><button class="mini danger" onclick="delSub('${esc(s.id)}',${i})">删</button>`
    ).join("<hr style='border:none;border-top:1px solid var(--line);margin:6px 0'>") || "无"}
    <button class="mini" onclick="addSub('${esc(s.id)}')">+ 订阅</button>
    <button class="mini" onclick="editSession('${esc(s.id)}')">会话信息</button></td></tr>`).join("");
  $("#config").innerHTML = `
  <div class="card"><h2>连接（一个账号一条）<span class="hint">改了要重启桥</span><button class="mini" onclick="addConnection()" style="float:right">+ 新连接</button></h2><table>
    <tr><th>id</th><th>平台</th><th>地址</th><th>令牌</th><th>账号</th><th>破坏性放行</th><th></th></tr>${connRows}</table></div>
  <div class="card"><h2>harness 会话<button class="mini" onclick="addSession()" style="float:right">+ 新会话</button></h2><table>
    <tr><th>id</th><th>harness</th><th>人格</th><th>接入令牌</th><th>订阅与唤醒</th></tr>${sessRows}</table></div>
  <div class="card"><h2>人格<button class="mini" onclick="addPersona()" style="float:right">+ 新人格</button></h2>${(c.personas||[]).map((p) => `<div class="kv"><div class="k">${esc(p.id)}（${esc(p.name)}）<button class="mini" onclick="editPersona('${esc(p.id)}')">编辑</button></div><pre>${esc(p.text)}</pre></div>`).join("") || '<p class="empty">无</p>'}</div>
  <div class="card"><h2>记忆<button class="mini" onclick="addMemory()" style="float:right">+ 新记忆仓库</button></h2>${(c.memories||[]).map((m) => `<div class="kv"><div class="k">${esc(m.id)}（${esc(m.name)}）<button class="mini" onclick="editMemory('${esc(m.id)}')">编辑</button></div><div>${esc(m.kind)} @ <span class="wrap">${esc(m.location)}</span></div></div>`).join("") || '<p class="empty">无</p>'}</div>
  <div class="card"><h2>文件中继</h2>${c.file_relay ? `<div class="kv">
    <div class="k">mode</div><div>${esc(c.file_relay.mode)}</div>
    <div class="k">listen</div><div>${esc(c.file_relay.listen)}</div>
    <div class="k">public_base</div><div class="wrap">${esc(c.file_relay.public_base)}</div>
    <div class="k">dir</div><div>${esc(c.file_relay.dir)}</div></div>` : '<p class="empty">没配（本机路径原样透传）</p>'}</div>
  <div class="card"><h2>运行参数</h2><div class="kv">
    <div class="k">库文件</div><div>${esc(c.storage && c.storage.path)}</div>
    <div class="k">保留策略</div><div>每房间 ${esc(c.retention && c.retention.max_records_per_room)} 条 / ${esc(c.retention && c.retention.max_age_days)} 天</div>
    <div class="k">一轮投递上限</div><div>${esc(c.delivery_limit)}</div>
    <div class="k">记忆 worktree 根</div><div>${esc(c.worktrees_root)}</div>
    <div class="k">失败通知默认动作</div><div>${esc((c.default_on_turn_error||[]).join(", ") || "只记日志")}</div></div>
    <p><button class="mini" onclick="editGlobals()">编辑运行参数</button></p></div>
  <div class="card"><h2>其他改动</h2>
    <div id="toml-result">${tomlResult ? renderTomlResult() : ""}</div>
    <p><button class="act ghost" onclick="editToml()">编辑 TOML 原文…</button>
    <span class="hint">兜底通道：listen / 中继 / 库路径这些监听类改动在这里改（保存后桥会列出哪些要重启）。</span></p>
  </div>`;
}

async function editToml() {
  try {
    const r = await api("/api/config/toml");
    tomlEditorText = r.text;
    tomlResult = null;
    loadConfig();
  } catch (e) { alert(e.message); }
}

function cancelToml() {
  tomlEditorText = null;
  tomlResult = null;
  loadConfig();
}

async function saveToml() {
  const text = $("#toml-text").value;
  try {
    const r = await api("/api/config/toml", { method: "POST", body: JSON.stringify({ text }) });
    tomlResult = r;
    tomlEditorText = null;
    loadConfig();
  } catch (e) {
    // 校验失败：留在编辑器里，错误贴在按钮下面，原文不动。
    tomlResult = { error: e.message };
    const box = $("#toml-result");
    if (box) box.innerHTML = '<p class="err">' + esc(e.message) + "</p>";
  }
}

async function discardStaged() {
  if (!confirm("放弃暂存的新配置？继续用当前生效的这份。")) return;
  try { await api("/api/config/discard", { method: "POST", body: "{}" }); loadConfig(); }
  catch (e) { alert(e.message); }
}

function renderTomlResult() {
  if (!tomlResult) return "";
  if (tomlResult.error) return '<p class="err">' + esc(tomlResult.error) + "</p>";
  const list = (items, cls) => (items||[]).map((i) => `<li class="${cls}">${esc(i)}</li>`).join("");
  return `<div class="card">
    <p>✓ ${esc(tomlResult.note || "已保存")}</p>
    ${(tomlResult.changes||[]).length ? "<p><b>本次改动：</b></p><ul>" + list(tomlResult.changes, "") + "</ul>" : ""}
    ${(tomlResult.hot_reload||[]).length ? "<p><b>下一轮自动生效：</b></p><ul>" + list(tomlResult.hot_reload, "") + "</ul>" : ""}
    ${(tomlResult.needs_restart||[]).length ? "<p class='err'><b>要重启桥才生效：</b></p><ul>" + list(tomlResult.needs_restart, "err") + "</ul>" : ""}
    ${!(tomlResult.hot_reload||[]).length && !(tomlResult.needs_restart||[]).length ? '<p class="muted">配置没变化（或变化不影响行为）。</p>' : ""}
  </div>`;
}

const tabs = {
  status: loadStatus,
  sessions: loadSessions,
  feedback: loadFeedback,
  config: loadConfig,
};

// ---------------------------------------------------------------------------
// 结构化表单编辑（主入口）：表单 → ops → POST /api/config/patch
// ---------------------------------------------------------------------------

const csv = (v) => String(v ?? "").split(/[,，]/).map((x) => x.trim()).filter(Boolean);
const findSession = (id) => (cfgCache?.sessions || []).find((s) => s.id === id);
const findPersona = (id) => (cfgCache?.personas || []).find((p) => p.id === id);
const findMemory = (id) => (cfgCache?.memories || []).find((m) => m.id === id);
const findConnection = (id) => (cfgCache?.connections || []).find((c) => c.id === id);

async function submitPatch(ops) {
  try {
    const r = await api("/api/config/patch", { method: "POST", body: JSON.stringify({ ops }) });
    tomlResult = r;
    loadConfig();
    return true;
  } catch (e) {
    tomlResult = { error: e.message };
    const box = $("#toml-result");
    if (box) box.innerHTML = '<p class="err">' + esc(e.message) + "</p>";
    // 弹窗开着时错误别只写进被遮住的角落，要让人看见。
    alert(e.message);
    return false;
  }
}

function closeModal() {
  $("#modal").classList.remove("open");
}

/** 表单弹窗：从点开的位置浮出，居中显示；点遮罩/取消关闭。 */
function formFrame(titleHtml, bodyHtml, onSave) {
  $("#modal-box").innerHTML = `<h2>${titleHtml}</h2>${bodyHtml}
    <p style="margin-bottom:0"><button class="act" id="form-save">保存</button>
    <button class="act ghost" onclick="closeModal()">取消</button></p>`;
  $("#modal").classList.add("open");
  $("#form-save").addEventListener("click", async () => {
    try {
      // onSave 返回 false（通常是补丁没保存成功）就不关弹窗，让人改完再存。
      const result = await onSave();
      if (result !== false) closeModal();
    } catch (e) { alert(e.message); }
  });
}

function wakeOpsFromForm(session, room, connection) {
  const val = (id) => document.getElementById(id).value;
  const chk = (id) => document.getElementById(id).checked;
  const acc = val("w-acc").trim();
  return [{
    op: "subscription", session, connection, room,
    wake: {
      at_mention: chk("w-at"), reply: chk("w-reply"),
      name_mention: chk("w-nm"), names: csv(val("w-names")),
      accumulate: acc === "" ? null : Number(acc),
      poke: chk("w-poke"), events: csv(val("w-events")),
      keywords: csv(val("w-kw")), ignore_speakers: csv(val("w-ign")),
    },
  }];
}

function editWake(sessionId, subIndex) {

function addSub(sessionId) {

function delSub(sessionId, subIndex) {
  const s = findSession(sessionId);
  const sub = s?.subscriptions?.[subIndex];
  if (!sub) return alert("找不到订阅（页面旧了？刷新一下）");
  if (!confirm(`删掉 ${sessionId} 对 ${sub.room} 的订阅？下一轮起这个房间的消息不再叫醒它。`)) return;
  submitPatch([{ op: "subscription", session: sessionId, room: sub.room, remove: true }]);
}

function editConnection(id) {
  const c = findConnection(id);
  if (!c) return alert("找不到连接");
  formFrame(`连接 — ${esc(id)} <span class="hint">（改了要重启桥）</span>`, `
    <div class="form-row"><label>地址</label><input type="text" id="c-url" value="${esc(c.url)}"></div>
    <div class="form-row"><label>账号</label><input type="text" id="c-account" value="${esc(c.account || "")}"></div>
    <div class="form-row"><label>令牌</label><input type="text" id="c-token" placeholder="留空不改；填单个 - 表示清除" style="width:320px"></div>`,
    () => {
      const patch = {};
      const url = document.getElementById("c-url").value.trim();
      const account = document.getElementById("c-account").value.trim();
      const token = document.getElementById("c-token").value;
      if (url && url !== c.url) patch.url = url;
      if (account && account !== c.account) patch.account = account;
      if (token === "-") patch.token = null;
      else if (token.trim() !== "") patch.token = token.trim();
      if (!Object.keys(patch).length) return alert("没有改动");
      submitPatch([{ op: "connection", id, patch }]);
    });
}

function editGlobals() {
  const c = cfgCache;
  formFrame("运行参数", `
    <div class="form-row"><label>单轮投递上限</label><input type="text" id="g-limit" value="${esc(c?.delivery_limit ?? "")}" style="width:80px"></div>
    <div class="form-row"><label>每房间留条数</label><input type="text" id="g-count" value="${esc(c?.retention?.max_records_per_room ?? "")}" style="width:80px"><span class="hint">0 = 不按条数清</span></div>
    <div class="form-row"><label>最多留天数</label><input type="text" id="g-days" value="${esc(c?.retention?.max_age_days ?? "")}" style="width:80px"><span class="hint">0 = 不按天数清</span></div>
    <div class="form-row"><label>默认失败通知</label><input type="text" id="g-err" value="${esc((c?.default_on_turn_error||[]).join(", "))}" placeholder="log 或 send:qq:group/123，逗号分隔"><span class="hint">留空 = 只记日志</span></div>`,
    () => {
      const patch = {};
      const num = (id) => { const v = document.getElementById(id).value.trim(); return v === "" ? undefined : Number(v); };
      const limit = num("g-limit"), count = num("g-count"), days = num("g-days");
      if (limit !== undefined) patch.delivery_limit = limit;
      if (count !== undefined) patch.max_records_per_room = count;
      if (days !== undefined) patch.max_age_days = days;
      patch.default_on_turn_error = csv(document.getElementById("g-err").value);
      submitPatch([{ op: "global", patch }]);
    });
}

const randToken = () => Array.from(crypto.getRandomValues(new Uint8Array(16)), (b) => b.toString(16).padStart(2, "0")).join("");

function addConnection() {
  formFrame("新增连接 <span class='hint'>（保存后要重启桥才连上）</span>", `
    <div class="form-row"><label>连接 id</label><input type="text" id="nc-id" placeholder="qq2"></div>

    <div class="form-row"><label>账号</label><input type="text" id="nc-account" placeholder="机器人 QQ 号"></div>
    <div class="form-row"><label>令牌</label><input type="text" id="nc-token" placeholder="可选（OneBot access token）"></div>`,
    () => {
      const g = (id) => document.getElementById(id).value.trim();
      const id = g("nc-id");
      if (!id) { alert("连接 id 不能为空"); return false; }
      if (!g("nc-url") || !g("nc-account")) { alert("地址和账号都得填"); return false; }
      const create = {
        platform: g("nc-platform"), kind: g("nc-kind"),
        url: g("nc-url"), account: g("nc-account"),
      };
      if (g("nc-token")) create.token = g("nc-token");
      return submitPatch([{ op: "connection", id, create }]);
    });
}

function addSession() {
  const harnesses = (cfgCache?.harnesses || []);
  if (!harnesses.length) { alert("配置里还没有任何 harness，先用「编辑 TOML 原文」加 [[harnesses]]"); return; }
  const personas = (cfgCache?.personas || []);
  formFrame("新增 harness 会话", `
    <div class="form-row"><label>会话 id</label><input type="text" id="ns-id" placeholder="dsh-group3"></div>
    <div class="form-row"><label>harness</label><select id="ns-harness">${harnesses.map((h) => `<option>${esc(h.id)}</option>`).join("")}</select></div>
    <div class="form-row"><label>人格</label><select id="ns-persona">${personas.map((p) => `<option>${esc(p.id)}</option>`).join("")}</select><span class="hint">必填；没有就先去建一个</span></div>
    <div class="form-row"><label>显示名</label><input type="text" id="ns-name" placeholder="可选"></div>
    <div class="form-row"><label>接入令牌</label><input type="text" id="ns-token" value="${randToken()}" style="width:340px"><span class="hint">harness 连桥用；驱动要重启才能拿到新会话的令牌</span></div>
    <p class="hint">建好后去「订阅」给它加房间；驱动侧要在 start-drivers.sh 里登记这个会话 id 才会被驱动。</p>`,
    () => {
      const g = (id) => document.getElementById(id).value.trim();
      const id = g("ns-id");
      if (!id) { alert("会话 id 不能为空"); return false; }
      const create = {
        harness: document.getElementById("ns-harness").value,
        token: g("ns-token"),
      };
      if (!create.token) { alert("接入令牌不能为空"); return false; }
      create.persona = document.getElementById("ns-persona").value;
      if (!create.persona) { alert("人格必填（配置里 persona 是必填项）"); return false; }
      if (g("ns-name")) create.name = g("ns-name");
      return submitPatch([{ op: "session", id, create }]);
    });
}
