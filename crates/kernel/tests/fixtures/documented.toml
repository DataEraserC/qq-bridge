# 这份配置逐字对应 docs/manual/02-config.md 里散落的片段，拼成一份完整文件。
# 测试解析它，用来防止文档与实现漂移——文档里的字段名改了而代码没跟上，
# 或者代码要求了文档没写的字段，都会在这里失败。
#
# 改这里之前先改文档；改文档之后同步改这里。

[[accounts]]
id = "main"
self_id = "10001"
ws_url = "ws://127.0.0.1:6700"
token = "env:QQ_TOKEN"

[[accounts]]
id = "backup"
self_id = "10002"
ws_url = "ws://127.0.0.1:6701"

[[personas]]
id = "whale"
text = """你是一个……"""

[[devices]]
id = "alice-phone"
persona = "whale"
memory = "alice"
accounts = ["main", "backup"]

  [[devices.scopes]]
  conversation = "20001"
  receive = ["main"]
  send = ["main", "backup"]

  [devices.wake]
  at_mention = true
  name_mention = true
  question = false
  keywords = ["小鲸鱼", "上线"]
  poke = true
  probability = 0.05
  any_message = false
  ignore_speakers = ["30002"]
  sleep_until = "2026-10-22T08:00:00+08:00"
  idle_prompt_after_min = 45

[[devices]]
id = "alice-pc"
persona = "whale"
memory = "alice"
accounts = ["backup"]

  [[devices.scopes]]
  conversation = "20003"
  receive = ["backup"]
  send = ["backup"]

[adapter]
socket = "/run/user/1000/qqab.sock"
turn_timeout_sec = 600

[notes]
max_entries = 2000
digest_budget_tokens = 800
