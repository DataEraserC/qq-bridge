[workspace]
resolver = "3"
members = ["crates/kernel", "crates/proto"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
time = { version = "0.3", features = ["serde", "parsing", "formatting"] }
toml = "0.9"
