[workspace]
resolver = "3"
members = [
    "crates/proto",
    "crates/adapter-api",
    "crates/kernel",
    "crates/adapters/onebot11",
    "crates/adapters/process",
    "crates/adapters/dynamic",
    "crates/adapters/dynamic-fixture",
    "crates/plugins/trusted",
    "crates/plugins/lua",
    "crates/plugins/wake-fixture",
    "crates/bridge",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.85"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
toml = "0.8"
