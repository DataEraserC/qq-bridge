# 桥的示例配置。字段语义见 docs/01-vision.md 与 docs/adr/0002-subscription-model.md。
#
# 一个设备 = 一个虚拟订阅者：一个人格、一份记忆、一组订阅。
# 一条订阅 = 一个房间 + 发送账号 + 唤醒策略。
#
# 房间写法是「平台:房间号」。QQ 用 group/<群号> 或 private/<号码>，
# 所以 QQ 群 123 要写成 qq:group/123。
#
# 令牌是 harness 连进来时用的身份：令牌对上哪个设备，那条连接就绑到哪个设备。
# 别把示例里的令牌直接用在真环境里。

[endpoint]
# harness 连这个地址。默认只听本机，外网连不上。
listen = "127.0.0.1:7700"

[storage]
# 状态库：流水、水位、笔记、「第几次投递」都在这一个 SQLite 文件里。
# 不配就用 state/acb.db（相对启动时的工作目录）。目录不存在会自动建。
# 备份就是拷这个文件；删了等于失忆，但桥不会因此起不来。
path = "state/acb.db"

[retention]
# 旧流水什么时候可以删。只削**已经读过**的那一段：任何在册设备还没读到的记录，
# 一条都不删。两项写 0 就是不作任何清理（库只增不减）。
# 每 5 分钟扫一次，删了什么会打一行「清理：… 删掉 N 条已读记录」。
max_records_per_room = 5000
max_age_days = 90

# 平台侧连接。一个平台一个适配器，桥按房间的平台名把消息交给它。
# OneBot 11 走正向 WebSocket：这里的地址是 OneBot 实现（NapCat / Lagrange / go-cqhttp…）
# 开出来的 WS 服务端地址。
[[adapters]]
platform = "qq"
kind = "onebot11"
url = "ws://127.0.0.1:3001"

[[devices]]
id = "main"
persona = "默认人格"
memory = "main-memory"
token = "换成你自己的一长串随机字符"

# QQ 群：@ 我、引用我的话、叫我名字、攒够 10 条就醒；被拍也醒。
[[devices.subscriptions]]
room = "qq:group/123456789"
send_account = "10001"

[devices.subscriptions.wake]
at_mention = true
reply = true          # 引用我发的某条消息也算对我说话（QQ 的「回复」就是这种）
name_mention = true
names = ["小助手"]
accumulate = 10
poke = true

# Discord 频道：只在 @ 我时醒；老王说话不叫醒（但照常记录）。
# 注意：Discord 适配器还没写，这一条只是示范「同一个设备可以跨平台订阅」。
[[devices.subscriptions]]
room = "discord:987654321"
send_account = "discord-bot"

[devices.subscriptions.wake]
at_mention = true
name_mention = false
accumulate = 20
poke = false
ignore_speakers = ["10001"]
