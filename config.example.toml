# 桥的示例配置。字段语义见 docs/01-vision.md 与 docs/adr/0002-subscription-model.md。
#
# 三层，从下往上：
#   连接 = 一条通到平台的管道（适配器 + 连接方式 + 地址 + 登录账号）。一个账号一条，
#          同一个平台可以有多条——两个 QQ 号就是两条连接。
#   设备 = 虚拟订阅者：一个人格、一份记忆、一把接入令牌、一组订阅。
#   订阅 = 连接 + 房间 + 唤醒策略。
#
# 房间写法是「连接名:段/段」。QQ 的群要写成 group/<群号>、私聊写成 private/<号码>，
# 所以「连接 qq 上那个群 123」要写成 qq:group/123。
# 第一段是**连接名**不是平台名：同一个号看同一个群只算一个房间，两个号看同一个群是两个。
#
# 令牌是 harness 连进来时用的身份：令牌对上哪几台设备，那条连接就代表这几台设备。
# 别把示例里的令牌直接用在真环境里。

[endpoint]
# harness 连这个地址。默认只听本机，外网连不上。
listen = "127.0.0.1:7700"

[storage]
# 状态库：流水、水位、笔记、「第几次投递」都在这一个 SQLite 文件里。
# 不配就用 state/acb.db（相对启动时的工作目录）。目录不存在会自动建。
# 备份就是拷这个文件；删了等于失忆，但桥不会因此起不来。
path = "state/acb.db"

[retention]
# 旧流水什么时候可以删。只削**已经读过**的那一段：任何在册设备还没读到的记录，
# 一条都不删。两项写 0 就是不作任何清理（库只增不减）。
# 每 5 分钟扫一次，删了什么会打一行「清理：… 删掉 N 条已读记录」。
max_records_per_room = 5000
max_age_days = 90

# ---------------------------------------------------------------------------
# 连接
# ---------------------------------------------------------------------------
# kind 说用哪个适配器（目前只有 onebot11），transport 说连接方向：
#   ws-client = 桥主动去连平台开出来的 WS 服务端（NapCat / Lagrange 等）
#   ws-server = 桥当服务端，等平台连过来（还没实现）
# account 是这条连接登录的号：桥靠它认出「这句是我自己说的」。
# 连上之后会跟平台报的号核对一次，对不上会警告。

[[connections]]
id = "qq"
platform = "qq"
kind = "onebot11"
transport = "ws-client"
url = "ws://127.0.0.1:3001"
token = ""
account = "10001"

# 同一个平台的第二个号：id 换个名字就行。它看到的群是 qq2:group/123，
# 跟 qq:group/123 是两个房间，各记各的水位，永远不会重复收。
[[connections]]
id = "qq2"
platform = "qq"
kind = "onebot11"
transport = "ws-client"
url = "ws://127.0.0.1:3002"
token = ""
account = "10002"

# ---------------------------------------------------------------------------
# 设备
# ---------------------------------------------------------------------------

[[devices]]
id = "main"
persona = "默认人格"
memory = "main-memory"
# 接入令牌：harness 用它连进来。同一把令牌配给多台设备 = 一次接入代表这几台设备。
token = "换成你自己的一长串随机字符"

# QQ 群：@ 我、引用我的话、叫我名字、攒够 5 条就醒；被拍也醒。
[[devices.subscriptions]]
connection = "qq"
room = "group/123456789"

[devices.subscriptions.wake]
at_mention = true
reply = true          # 引用我发的某条消息也算对我说话（QQ 的「回复」就是这种）
name_mention = true
names = ["小助手"]
accumulate = 5
poke = true

# 第二个号的私聊：只在 @ 我或回复我时醒；那个人说话不叫醒（但照常记录）。
[[devices.subscriptions]]
connection = "qq2"
room = "private/987654321"

[devices.subscriptions.wake]
at_mention = true
reply = true
name_mention = false
accumulate = 20
poke = false
ignore_speakers = ["987654321"]
