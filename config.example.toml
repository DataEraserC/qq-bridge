# 桥的示例配置。字段语义见 docs/adr/0017-multi-agent-model.md 与 docs/adr/0002-subscription-model.md。
#
# 五个一等对象，从下往上（ADR-0017）：
#   连接   = 一条通到平台的管道（适配器 + 连接方式 + 地址 + 登录账号）。一个账号一条，
#            同一个平台可以有多条——两个 QQ 号就是两条连接。
#   人格   = 一张纯文本人设卡（id + name + text）。只管「是谁、什么语气、什么不能漏」，
#            不带记忆、不带订阅、不声明能力。
#   记忆   = 一份长期知识，抽象接口（id + name + kind + location）。kind 目前只有 git。
#   harness = 一个接管者（id + name）。桥不主动连它，是它反过来连桥报名字 + 令牌。
#   会话   = 一个串行单元（id + name 可空 + harness id + 人格 id + 记忆 ids 可空 +
#            model 可空 + 订阅）。串行键 = harness id + 会话 id。
#   订阅   = 连接 + 房间 + 唤醒策略。
#
# 房间写法是「连接名:段/段」。QQ 的群要写成 group/<群号>、私聊写成 private/<号码>，
# 所以「连接 qq 上那个群 123」要写成 qq:group/123。
# 第一段是**连接名**不是平台名：同一个号看同一个群只算一个房间，两个号看同一个群是两个。
#
# 令牌 + harness id 是 harness 连进来时报的身份：名字对上、令牌对上，那条连接就代表
# 这个 harness 接管的那组会话。别把示例里的令牌直接用在真环境里。

[endpoint]
# harness 连这个地址。默认只听本机，外网连不上。
listen = "127.0.0.1:7700"

# 桥侧统一控制台（ADR-0018）：一个 HTTP 服务，能读会话/映射状态、重置会话。
# 可选，不配就不起。可远程访问，所以 token 必填、必须认真校验。
# 请求都要带 `Authorization: Bearer <token>`。
# 端点：GET /api/status、GET /api/sessions、POST /api/session/:id/reset、GET /
# 要启用就把下面三行取消注释：
# [console]
# listen = "127.0.0.1:3100"
# token = "换成你自己的一长串随机字符"

[storage]
# 状态库：流水、水位、笔记、「第几次投递」都在这一个 SQLite 文件里。
# 不配就用 state/acb.db（相对启动时的工作目录）。目录不存在会自动建。
# 备份就是拷这个文件；删了等于失忆，但桥不会因此起不来。
path = "state/acb.db"

# worktree 根目录：每个「会话 × 记忆」的 worktree 都 checkout 到这里，
# 按「根/记忆id/会话id」分层。不配就用 state/worktrees。
# 桥只负责第一次把 worktree 建出来，之后文件读写和 git 操作全交给 harness。
worktrees_root = "state/worktrees"

# 一轮最多跑多久（秒）。不配 = 300（沿用 dsh 原来的兜底值）。
#   0 = 关闭超时：模型想跑多久跑多久，桥不掐、harness 也不许自己掐。
#   n > 0 = 到点还没结束，harness 主动打断本侧会话（dsh 有队列能打断；不支持
#   打断的 harness 按各自兜底）。打断算这轮失败，走 on_turn_error 通知。
# turn_timeout_secs = 300

[retention]
# 旧流水什么时候可以删。只削**已经读过**的那一段：任何在册会话还没读到的记录，
# 一条都不删。两项写 0 就是不作任何清理（库只增不减）。
# 每 5 分钟扫一次，删了什么会打一行「清理：… 删掉 N 条已读记录」。
max_records_per_room = 5000
max_age_days = 90

# ---------------------------------------------------------------------------
# 连接
# ---------------------------------------------------------------------------
# kind 说用哪个适配器（目前只有 onebot11），transport 说连接方向：
#   ws-client = 桥主动去连平台开出来的 WS 服务端（NapCat / Lagrange 等）
#   ws-server = 桥当服务端，等平台连过来（还没实现）
# account 是这条连接登录的号：桥靠它认出「这句是我自己说的」。
# 连上之后会跟平台报的号核对一次，对不上会警告。
#
# allow_destructive：破坏性平台方法（踢人、禁言、改群名、撤回别人消息、解散群……）
# 放不放给模型。不写 = 全关。三种写法等价可选：
#   allow_destructive = true                    # 全开：人在群里能做的，模型都能做
#   allow_destructive = ["group.kick", "group.ban"]   # 只开这几个
#   allow_destructive = false                   # 全关（默认）
# 想让它真的顶一个人的位置干活，就写 true；只想像个普通成员聊天，就别写。

[[connections]]
id = "qq"
platform = "qq"
kind = "onebot11"
transport = "ws-client"
url = "ws://127.0.0.1:3001"
token = ""
account = "10001"
# 想让它真顶一个人的位置（能踢人能禁言能改群名），把这行改成 true。
allow_destructive = false

# 同一个平台的第二个号：id 换个名字就行。它看到的群是 qq2:group/123，
# 跟 qq:group/123 是两个房间，各记各的水位，永远不会重复收。
[[connections]]
id = "qq2"
platform = "qq"
kind = "onebot11"
transport = "ws-client"
url = "ws://127.0.0.1:3002"
token = ""
account = "10002"

# ---------------------------------------------------------------------------
# 人格
# ---------------------------------------------------------------------------
# 一张卡一份。text 是投递给模型的人设正文。能力（能不能 bash/git/用工具）不写在这里，
# 由会话配置与 harness/适配器决定。

[[personas]]
id = "default"
name = "默认人格"
text = """
你是谁、什么性格、什么语气，写在这里。
只写「怎么说话」和「信息边界」（什么不能说、什么不能漏），
不要写「你没有本地工具」这类能力声明——能力由会话配置和 harness 决定。
"""

# ---------------------------------------------------------------------------
# 记忆
# ---------------------------------------------------------------------------
# 一份记忆一个 id。kind 目前只有 git，location 是仓库路径。
# 桥只负责初始化 worktree 并告诉 harness「当前会话的 worktree 路径」，
# 文件读写和 git 操作全部由 harness 直接做（桥不做提交/推送/建分支/改内容）。

[[memories]]
id = "main-memory"
name = "主记忆"
kind = "git"
location = "/home/you/qqab-memories/main"

# ---------------------------------------------------------------------------
# harness
# ---------------------------------------------------------------------------
# 一个 harness = 一个接管者（id + name）。桥不主动连它——是它反过来连桥、报出名字
# + 令牌。桥只存「有哪些 harness」用来校验会话的引用，不存它的连接地址或内部配置。
# 会话里的 harness 字段必须指向这里定义过的某个 id。

[[harnesses]]
id = "opencode"
name = "OpenCode"

[[harnesses]]
id = "dsh"
name = "DeepSeek"

# ---------------------------------------------------------------------------
# 会话
# ---------------------------------------------------------------------------
# 一个会话 = 一个串行单元。harness id + 会话 id 是它的串行键。
# name 可空（缺省 = id）；memories 可空（空 = 不存长期记忆）；
# model 可空（空 = 由 harness 侧自己决定用哪个模型）；persona 必须指向上面定义的人格卡。

[[sessions]]
id = "main"
harness = "dsh"
name = "QQ 主群助手"
persona = "default"
memories = ["main-memory"]
# model 这个会话要用哪个模型。留空 = 由 harness 侧决定（dsh 改 profile、opencode 改 config）。
model = "deepseek-chat"
# 接入令牌：harness 连进来时报出 harness id + 这个令牌，桥据此绑定会话。
token = "换成你自己的一长串随机字符"

# 投递批次选择（ADR-0026 Phase 4）。不写就是内置「最旧一小段 + 最新一批」。
# [sessions.delivery]
# provider = "acb.delivery.default"

# 发送前/后钩子（ADR-0026 Phase 4）。before 可以改写正文，after 只观察回执。
# 列表里写 provider id，由已安装的 manager 提供；不写 = 不挂钩子。
# [sessions.outbound]
# before = []
# after = []

# 失败通知策略（ADR-0026）。不写就是内置：会话 on_turn_error 非空就用它，
# 否则回退全局 default_on_turn_error。
# [sessions.turn_error]
# provider = "acb.turn_error.default"

# QQ 群：@ 我、引用我的话、叫我名字、攒够 5 条就醒；被拍也醒。
[[sessions.subscriptions]]
connection = "qq"
room = "group/123456789"

[sessions.subscriptions.wake]
provider = "acb.wake.default"  # 唤醒策略实现（ADR-0026）；不写就是内置
at_mention = true
reply = true          # 引用我发的某条消息也算对我说话（QQ 的「回复」就是这种）
name_mention = true
names = ["小助手"]
accumulate = 5
poke = true

# 第二个号的私聊：只在 @ 我或回复我时醒；那个人说话不叫醒（但照常记录）。
[[sessions.subscriptions]]
connection = "qq2"
room = "private/987654321"

[sessions.subscriptions.wake]
at_mention = true
reply = true
name_mention = false
accumulate = 20
poke = false
ignore_speakers = ["987654321"]
